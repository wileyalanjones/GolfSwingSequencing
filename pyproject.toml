[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "golfswing"
version = "0.1.0"
description = "Deep learning model that detects golf swing events directly from video"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wiley Jones" }]
keywords = ["golf", "deep-learning", "video", "tensorflow", "lstm", "action-recognition"]
dependencies = [
    "tensorflow>=2.10",
    "numpy",
    "pandas",
    "scikit-learn",
    "opencv-python",
    "moviepy",
    "matplotlib",
    "seaborn",
    "focal-loss",
    "gdown",
]

[tool.setuptools]
packages = ["golfswing"]