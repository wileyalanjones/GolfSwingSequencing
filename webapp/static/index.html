<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Golf Swing Sequencer</title>
        <style>
        </style>
    </head>
    <body>
        <h1>Golf Swing Sequencing</h1>
        <p>Upload a video of a golf swing to the 8 key moments</p>
        <input type="file" id="video" accept="video/*">
        <button id="analyze">Analyze</button>
        <p id="status"></p>
        <div id="results"></div>
        <script>
            const fileInput = document.getElementById('video');
            const button = document.getElementById("analyze");
            const statusEl = document.getElementById("status");
            const results = document.getElementById("results");

            function setStatus(message, isError = false) {
                statusEl.textContent = message;
                statusEl.className = isError ? "error" : "";
            }

            button.addEventListener("click", async () => {
                const file = fileInput.files[0];
                if (!file) {
                    setStatus("Please choose a video first", true);
                    return;
                }

                const formData = new FormData();
                formData.append("video", file);
                button.disabled = true;
                results.innerHTML = "";
                setStatus("Analyzing...");

                try {
                    const response = await fetch("/api/analyze", {
                        method: "POST",
                        body: formData,
                    });
                    const data = await response.json();

                    if (!response.ok) {
                        const message = typeof data.detail === "string" ? data.detail : "Something went wrong."
                        throw new Error(message);
                    }

                    for (const event of data.events) {
                        const figure = document.createElement("figure");
                        const img = document.createElement("img");
                        img.src = event.image;
                        img.alt = event.event;
                        const caption = document.createElement("figcaption");
                        caption.textContent = `${event.event} (frame ${event.frame})`;
                        figure.append(img, caption);
                        results.append(figure);
                    }
                    setStatus("Done.");
                } catch (err) {
                    setStatus(err.message, true)
                } finally {
                    button.disable = false;
                }
            });
        </script>
    </body>
</html>
